name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            # Check out the repository so Copilot has access to the skill definitions
            # in .github/agents/ and the skills/ directory.
            # No additional dependencies are required for this Markdown-only repository.
            - name: Checkout code
              uses: actions/checkout@v4
